<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CS436 Virtual Tour</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; color: white; font-family: monospace; overflow: hidden; }
        #overlay {
            position: absolute; top: 10px; left: 10px; padding: 10px;
            background: rgba(0, 0, 0, 0.8); border-radius: 5px; pointer-events: none;
            font-size: 14px; line-height: 1.6;
        }
        #controls {
            position: absolute; bottom: 10px; left: 10px; padding: 10px;
            background: rgba(0, 0, 0, 0.8); border-radius: 5px;
        }
        #controls button {
            background: #333; color: white; border: 1px solid #555;
            padding: 8px 12px; margin: 2px; cursor: pointer; border-radius: 3px;
            font-family: monospace;
        }
        #controls button:hover { background: #444; }
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; color: #00ff00;
        }
    </style>
    <!-- Import Maps Polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loader">Loading Data...</div>
    <div id="overlay">
        CS436 Milestone 4<br>
        • Left Click + Drag: Rotate<br>
        • Right Click + Drag: Pan<br>
        • Scroll: Zoom<br>
        • Click Yellow Cone: Fly to Camera View<br>
        • Double Click Background: Reset View
    </div>
    <div id="controls">
        <button id="brighterBtn">Brighter</button>
        <button id="darkerBtn">Darker</button>
        <button id="biggerBtn">Bigger Points</button>
        <button id="smallerBtn">Smaller Points</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import TWEEN from 'three/addons/libs/tween.module.js';

        let scene, camera, renderer, controls;
        let raycaster, mouse;
        let camerasGroup;
        let pointsMaterial; // Store for adjustments

        init();
        animate();

        function init() {
            // 1. Setup Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a); // Darker background to make points pop
            
            // Add subtle ambient lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // Add reference grid (size 20, 20 divisions)
            const gridHelper = new THREE.GridHelper(20, 20);
            scene.add(gridHelper);
            
            // Add Axes (Red=X, Green=Y, Blue=Z)
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);

            // 2. Setup Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
            camera.position.set(5, 5, 5); // Start angled

            // 3. Setup Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 4. Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true; // Rotates until user interacts

            // 5. Interactions
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            camerasGroup = new THREE.Group();
            scene.add(camerasGroup);

            window.addEventListener('resize', onResize);
            window.addEventListener('click', onClick);
            window.addEventListener('dblclick', resetView);
            
            // Control buttons
            document.getElementById('brighterBtn').addEventListener('click', () => adjustBrightness(1.2));
            document.getElementById('darkerBtn').addEventListener('click', () => adjustBrightness(0.8));
            document.getElementById('biggerBtn').addEventListener('click', () => adjustPointSize(1.2));
            document.getElementById('smallerBtn').addEventListener('click', () => adjustPointSize(0.8));

            // 6. Load Data
            loadData();
        }

        function loadData() {
            const loader = new PLYLoader();
            
            // Load Point Cloud
            loader.load('./point_cloud.ply', (geometry) => {
                geometry.computeVertexNormals();
                
                // Boost colors if they're too dark
                const colors = geometry.attributes.color;
                if (colors) {
                    for (let i = 0; i < colors.count; i++) {
                        // Apply gamma correction to brighten
                        colors.array[i * 3] = Math.pow(colors.array[i * 3], 0.6);
                        colors.array[i * 3 + 1] = Math.pow(colors.array[i * 3 + 1], 0.6);
                        colors.array[i * 3 + 2] = Math.pow(colors.array[i * 3 + 2], 0.6);
                    }
                    colors.needsUpdate = true;
                }
                
                // Point Material with brightness boost
                pointsMaterial = new THREE.PointsMaterial({ 
                    size: 0.12, // Increased size
                    vertexColors: true,
                    sizeAttenuation: true // Size decreases with distance
                });
                
                const points = new THREE.Points(geometry, pointsMaterial);
                
                // Usually SfM data is inverted on one axis, rotate to fix
                points.rotation.x = -Math.PI; 
                scene.add(points);
                
                document.getElementById('loader').style.display = 'none';
                controls.autoRotate = false; // Stop auto rotate once loaded
                console.log("Point cloud loaded.");
            }, undefined, (err) => {
                console.error(err);
                document.getElementById('loader').innerText = "Error: point_cloud.ply not found!";
                document.getElementById('loader').style.color = "red";
            });

            // Load Cameras
            fetch('./cameras.json').then(r => r.json()).then(data => {
                // Setup Camera Cone Geometry
                const geom = new THREE.ConeGeometry(0.2, 0.4, 4);
                geom.rotateX(-Math.PI / 2); 
                geom.rotateY(Math.PI / 4);

                data.forEach(cam => {
                    const mat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true });
                    const mesh = new THREE.Mesh(geom, mat);
                    
                    // Apply Matrix
                    const m = new THREE.Matrix4().fromArray(cam.pose_matrix);
                    const pos = new THREE.Vector3();
                    const quat = new THREE.Quaternion();
                    const scl = new THREE.Vector3();
                    
                    m.decompose(pos, quat, scl);
                    
                    mesh.position.copy(pos);
                    mesh.quaternion.copy(quat);
                    
                    // User data for clicking
                    mesh.userData = { id: cam.id, pos: pos, quat: quat };
                    
                    camerasGroup.add(mesh);
                });
                camerasGroup.rotation.x = -Math.PI; // Match point cloud rotation
                console.log("Cameras loaded:", data.length);
            }).catch(err => {
                console.error(err);
                // Don't block app if cameras fail
            });
        }

        function onClick(event) {
            // Normalized Coordinates
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(camerasGroup.children);

            if (hits.length > 0) {
                const target = hits[0].object;
                console.log("Flying to camera", target.userData.id);
                
                // Get World Position (accounting for group rotation)
                const targetPos = new THREE.Vector3();
                target.getWorldPosition(targetPos);
                
                // Animate Camera Position
                new TWEEN.Tween(camera.position)
                    .to(targetPos, 2000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
                
                // Animate LookAt (Zero is usually the subject of SfM)
                new TWEEN.Tween(controls.target)
                    .to({x: 0, y: 0, z: 0}, 2000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
            }
        }

        function resetView() {
            new TWEEN.Tween(camera.position)
                .to({x: 5, y: 5, z: 5}, 1000)
                .start();
        }
        
        function adjustBrightness(factor) {
            if (!pointsMaterial) return;
            scene.traverse((obj) => {
                if (obj.isPoints && obj.geometry.attributes.color) {
                    const colors = obj.geometry.attributes.color;
                    for (let i = 0; i < colors.count; i++) {
                        colors.array[i * 3] = Math.min(1, colors.array[i * 3] * factor);
                        colors.array[i * 3 + 1] = Math.min(1, colors.array[i * 3 + 1] * factor);
                        colors.array[i * 3 + 2] = Math.min(1, colors.array[i * 3 + 2] * factor);
                    }
                    colors.needsUpdate = true;
                }
            });
        }
        
        function adjustPointSize(factor) {
            if (!pointsMaterial) return;
            pointsMaterial.size = Math.max(0.02, Math.min(0.5, pointsMaterial.size * factor));
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
