        let scene, camera, renderer, controls;
        let pointCloud;
        let area1Group, area2Group, area3Group;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let isTransitioning = false;
        let transitionStartTime;
        let startPos = new THREE.Vector3();
        let startQuat = new THREE.Quaternion();
        let targetPos = new THREE.Vector3();
        let targetQuat = new THREE.Quaternion();
        const TRANSITION_DURATION = 1500;
        const INITIAL_CAMERA_POS = new THREE.Vector3(5, 8, 15);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.Fog(0x1a1a1a, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.copy(INITIAL_CAMERA_POS);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(2, 0, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);

            area1Group = new THREE.Group();
            area1Group.name = 'Area 1';
            scene.add(area1Group);

            area2Group = new THREE.Group();
            area2Group.name = 'Area 2';
            scene.add(area2Group);

            area3Group = new THREE.Group();
            area3Group.name = 'Area 3';
            scene.add(area3Group);

            const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
            scene.add(gridHelper);

            loadResources();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);
            
            document.getElementById('toggle-cloud').onclick = () => {
                if(pointCloud) pointCloud.visible = !pointCloud.visible;
            };
            document.getElementById('toggle-cameras').onclick = () => {
                area1Group.visible = !area1Group.visible;
                area2Group.visible = !area2Group.visible;
                area3Group.visible = !area3Group.visible;
            };
            document.getElementById('reset-view').onclick = resetView;
        }

        function resetView() {
            camera.position.copy(INITIAL_CAMERA_POS);
            controls.target.set(2, 0, 0);
            document.getElementById('imageOverlay').style.opacity = '0';
            document.getElementById('current-view').innerText = 'Current: Overview';
        }

        function loadResources() {
            const plyLoader = new PLYLoader();
            plyLoader.load('./point_cloud.ply',
                function (geometry) {
                    const material = new THREE.PointsMaterial({ 
                        size: 0.03,
                        vertexColors: true 
                    });
                    pointCloud = new THREE.Points(geometry, material);
                    scene.add(pointCloud);
                },
                undefined,
                function(error) {
                    console.log('Point cloud not found - continuing with cameras only');
                }
            );

            createCameraVisualization();
            document.getElementById('loading').style.display = 'none';
        }

        function createCameraVisualization() {
            const area1Cams = [];
            const area2Cams = [];
            const area3Cams = [];

            CAMERAS_DATA.forEach(camData => {
                if (camData.id <= 28) {
                    area1Cams.push(camData);
                } else if (camData.id <= 32) {
                    area2Cams.push(camData);
                } else {
                    area3Cams.push(camData);
                }
            });

            createAreaCameras(area1Cams, area1Group, 0x00ff00);
            createAreaCameras(area2Cams, area2Group, 0x0088ff);
            createAreaCameras(area3Cams, area3Group, 0xff0000);

            const transformMatrix = new THREE.Matrix4();
            transformMatrix.makeRotationY(Math.PI);
            transformMatrix.setPosition(-10, 0, 5);
            area2Group.applyMatrix4(transformMatrix);

            const transform3 = new THREE.Matrix4();
            transform3.makeRotationY(Math.PI / 4);
            transform3.setPosition(0, -1, 3);
            area3Group.applyMatrix4(transform3);

            document.getElementById('camera-info').innerText = 
                `Cameras: Area1=${area1Cams.length} Area2=${area2Cams.length} Area3=${area3Cams.length}`;
        }

        function createAreaCameras(cameras, group, color) {
            const geom = new THREE.ConeGeometry(0.15, 0.4, 4);
            geom.rotateX(Math.PI / 2);

            cameras.forEach(camData => {
                const material = new THREE.MeshBasicMaterial({ 
                    color: color, 
                    wireframe: false,
                    transparent: true,
                    opacity: 0.8
                });
                const mesh = new THREE.Mesh(geom, material);

                const matrix = new THREE.Matrix4();
                matrix.fromArray(camData.matrix);
                
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                const scale = new THREE.Vector3();
                matrix.decompose(pos, quat, scale);

                mesh.position.copy(pos);
                mesh.quaternion.copy(quat);

                mesh.userData = { 
                    id: camData.id, 
                    filename: camData.filename,
                    originalMatrix: matrix.clone()
                };
                
                group.add(mesh);
            });
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const allCameras = [
                ...area1Group.children,

            font-size: 14px;

        }
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-text {
            font-size: 12px;
            padding: 8px;
            margin: 4px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e0e0e0;
        }

        #miniMap {

            top: 20px;
            right: 20px;
            width: 280px;
            height: 220px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #667eea;
            border-radius: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #progressBar {

            bottom: 0;
            left: 0;

7466388,0.9855920091193662,-0.16349050036953966,-0.33280422476664145,-0.10384389113467271,0.15831278451950395,0.9819131878795047,1.647045050287055,0.0,0.0,0.0,1.0]},{"id":34,"filename":"photo35.jpeg","matrix":[0.9800636580887988,0.04001363410111135,0.19461278267273366,2.226141253125479,-0.043408471209646624,0.9989700830095257,0.013209007501791036,0.18972492650855016,-0.19388380726828003,-0.021393511585606293,0.9807912045594581,0.9849669242697346,0.0,0.0,0.0,1.0]}];

        // State
        let currentIndex = 0;
        let cameraPositions = [];
        let isTransitioning = false;
        let show3D = false;

        // Three.js for 3D view
        let scene, camera3d, renderer, controls, pointCloud;

        // Process camera data
        function processCameraData() {
            CAMERAS.forEach(cam => {
                const m = new THREE.Matrix4();
                m.set(
                    cam.matrix[0], cam.matrix[4], cam.matrix[8],  cam.matrix[12],
                    cam.matrix[1], cam.matrix[5], cam.matrix[9],  cam.matrix[13],
                    cam.matrix[2], cam.matrix[6], cam.matrix[10], cam.matrix[14],
                    cam.matrix[3], cam.matrix[7], cam.matrix[11], cam.matrix[15]
                );
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                const scale = new THREE.Vector3();
                m.decompose(pos, quat, scale);
                
                cameraPositions.push({
                    id: cam.id,
                    filename: cam.filename,
                    pos: pos,
                    quat: quat
                });
            });
        }

        // Initialize
        function init() {
            processCameraData();
            setupMiniMap();
            setup3DView();
            navigateToIndex(0);
            
            // Event listeners
            document.getElementById('prevBtn').onclick = () => navigateToIndex(currentIndex - 1);
            document.getElementById('nextBtn').onclick = () => navigateToIndex(currentIndex + 1);
            document.getElementById('toggle3dBtn').onclick = toggle3DView;
            document.getElementById('mainImage').onclick = () => navigateToIndex(currentIndex + 1);
            
            document.getElementById('loading').style.display = 'none';
        }

        // Navigate to specific camera index
        function navigateToIndex(index) {
            if (isTransitioning || index < 0 || index >= CAMERAS.length) return;
            
            isTransitioning = true;
            currentIndex = index;
            
            const img = document.getElementById('mainImage');
            img.classList.remove('visible');
            
            setTimeout(() => {
                // Update path to use 'ds' folder
                img.src = `ds/${CAMERAS[index].filename}`;
                img.onload = () => {
                    img.classList.add('visible');
                    updateHotspots();
                    updateUI();
                    updateMiniMap();
                    setTimeout(() => isTransitioning = false, 600);
                };
                img.onerror = () => {
                    console.warn(`Image not found: ds/${CAMERAS[index].filename}`);
                    img.style.opacity = '0.3';
                    updateHotspots();
                    updateUI();
                    setTimeout(() => isTransitioning = false, 600);
                };
            }, 300);
        }

        // Update hotspots based on nearby cameras
        function updateHotspots() {
            const container = document.getElementById('hotspotsContainer');
            container.innerHTML = '';
            
            const current = cameraPositions[currentIndex];
            const nearby = findNearbyViews(current, 4);
            
            nearby.forEach(target => {
                const hotspot = document.createElement('div');
                hotspot.className = 'hotspot';
                hotspot.innerHTML = '→';
                hotspot.title = `Navigate to ${target.filename}`;
                
                const angle = calculateScreenAngle(current, target);
                const distance = current.pos.distanceTo(target.pos);
                const radius = Math.min(350, 120 + distance * 15);
                
                hotspot.style.left = `calc(50% + ${Math.cos(angle) * radius}px - 35px)`;
                hotspot.style.top = `calc(50% + ${Math.sin(angle) * radius}px - 35px)`;
                
                hotspot.onclick = (e) => {
                    e.stopPropagation();
                    navigateToIndex(target.id);
                };
                
                container.appendChild(hotspot);
            });
        }

        // Find nearby camera views
        function findNearbyViews(current, maxCount) {
            return cameraPositions
                .filter(c => c.id !== current.id)
                .map(c => ({ ...c, dist: current.pos.distanceTo(c.pos) }))
                .sort((a, b) => a.dist - b.dist)
                .slice(0, maxCount);
        }

        // Calculate screen angle for hotspot placement
        function calculateScreenAngle(from, to) {
            const dir = new THREE.Vector3().subVectors(to.pos, from.pos).normalize();
            const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(from.quat);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(from.quat);
            
            const x = dir.dot(right);
            const z = -dir.dot(fwd);
            return Math.atan2(z, x);
        }

        // Update UI elements
        function updateUI() {
            document.getElementById('currentView').textContent = `📍 ${CAMERAS[currentIndex].filename}`;
            document.getElementById('cameraCount').textContent = `${currentIndex + 1} / ${CAMERAS.length} viewpoints`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / CAMERAS.length) * 100}%`;
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === CAMERAS.length - 1;
        }

        // Mini map setup
        let miniMapCtx;
        function setupMiniMap() {
            const canvas = document.getElementById('miniMap');
            canvas.width = 280;
            canvas.height = 220;
            miniMapCtx = canvas.getContext('2d');
        }

        function updateMiniMap() {
            const ctx = miniMapCtx;
            const w = 280, h = 220;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, w, h);
            
            // Calculate bounds
            const positions = cameraPositions.map(c => c.pos);
            const minX = Math.min(...positions.map(p => p.x)) - 2;
            const maxX = Math.max(...positions.map(p => p.x)) + 2;
            const minZ = Math.min(...positions.map(p => p.z)) - 2;
            const maxZ = Math.max(...positions.map(p => p.z)) + 2;
            
            // Draw path
            cameraPositions.forEach((cam, i) => {
                const x = ((cam.pos.x - minX) / (maxX - minX)) * (w - 40) + 20;
                const y = ((cam.pos.z - minZ) / (maxZ - minZ)) * (h - 40) + 20;
                
                // Draw connections
                if (i < cameraPositions.length - 1) {
                    const next = cameraPositions[i + 1];
                    const nx = ((next.pos.x - minX) / (maxX - minX)) * (w - 40) + 20;
                    const ny = ((next.pos.z - minZ) / (maxZ - minZ)) * (h - 40) + 20;
                    ctx.strokeStyle = 'rgba(102, 126, 234, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(nx, ny);
                    ctx.stroke();
                }
                
                // Draw points
                ctx.beginPath();
                ctx.arc(x, y, i === currentIndex ? 8 : 3, 0, Math.PI * 2);
                ctx.fillStyle = i === currentIndex ? '#00ff88' : '#667eea';
                ctx.fill();
            });
        }

        // 3D View setup
        function setup3DView() {
            const canvas = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera3d = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera3d.position.set(5, 8, 15);
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            controls = new OrbitControls(camera3d, canvas);
            controls.enableDamping = true;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);
            
            // Add camera visualization
            const coneGeom = new THREE.ConeGeometry(0.15, 0.4, 4);
            coneGeom.rotateX(Math.PI / 2);
            
            cameraPositions.forEach(camData => {
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x00ff88,
                    transparent: true,
                    opacity: 0.8
                });
                const mesh = new THREE.Mesh(coneGeom, material);
                mesh.position.copy(camData.pos);
                mesh.quaternion.copy(camData.quat);
                scene.add(mesh);
            });
            
            // Try to load point cloud
            const loader = new PLYLoader();
            loader.load('point_cloud.ply',
                function(geometry) {
                    const material = new THREE.PointsMaterial({ 
                        size: 0.03,
                        vertexColors: true 
                    });
                    pointCloud = new THREE.Points(geometry, material);
                    scene.add(pointCloud);
                },
                undefined,
                function(error) {
                    console.log('Point cloud not found - showing cameras only');
                }
            );
            
            // Grid
            const gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
            scene.add(gridHelper);
        }

        function animate3D() {
            if (show3D) {
                requestAnimationFrame(animate3D);
                controls.update();
                renderer.render(scene, camera3d);
            }
        }

        function toggle3DView() {
            show3D = !show3D;
            document.getElementById('canvas3d').style.display = show3D ? 'block' : 'none';
            document.getElementById('mainImage').style.display = show3D ? 'none' : 'block';
            document.getElementById('hotspotsContainer').style.display = show3D ? 'none' : 'block';
            
            if (show3D) {
                animate3D();
            }
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            if (show3D) {
                camera3d.aspect = window.innerWidth / window.innerHeight;
                camera3d.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Start the app
        init();
    </script>
